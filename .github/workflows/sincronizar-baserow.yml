name: Sincronizar dados do Baserow

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# uma sincronização por vez: a disparada à mão espera a automática terminar
concurrency:
  group: sincronizar-baserow

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar dados-animais.json a partir do Baserow
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          BASEROW_TABLE_ID: "1178421"
        run: node scripts/gerar-dados.mjs

      - name: Publicar se algo mudou
        run: |
          # a/ = páginas de compartilhamento de cada animal (foto na pré-visualização)
          git add -A dados-animais.json a
          if git diff --cached --quiet; then
            echo "Sem mudanças, nada a publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincroniza dados-animais.json com o Baserow"
          # se outro commit chegou no meio, o JSON recém-gerado do Baserow prevalece
          git pull --rebase -X theirs
          git push
